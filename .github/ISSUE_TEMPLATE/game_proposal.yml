name: Game proposal
description: Propose a new game or mode
labels: ["game-proposal"]
body:
  - type: textarea
    id: idea
    attributes: { label: The idea, description: "What does the player do in one minute?" }
    validations: { required: true }
  - type: textarea
    id: skill
    attributes: { label: How skill decides the result, description: "Why is it skill and not luck? What can a better player do?" }
    validations: { required: true }
  - type: textarea
    id: server
    attributes: { label: What it needs from the server, description: "Inputs, rules, determinism, match length, players per match" }
  - type: textarea
    id: risks
    attributes: { label: Risks and open questions, description: "Cheating, collusion, fairness, legal questions" }
